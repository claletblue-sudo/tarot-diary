<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#fbf5ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="오늘의 타로">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>오늘의 타로</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Gamja+Flower&family=Poor+Story&display=swap');

  :root {
    --bg-deep: #fbf5ff;
    --bg-panel: #ffffff;
    --bg-card: #fffaf2;
    --gold: #c9975a;
    --gold-soft: #cf9f66;
    --gold-text: #8a5a2a;
    --ink: #4a3f66;
    --ink-dim: #5f5286;
    --ink-faint: #726494;
    --border: #e4cdf0;
    --accent-line: linear-gradient(90deg, transparent, #8a5a2a, transparent);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg-deep);
    background-image:
      radial-gradient(ellipse at 15% 0%, rgba(190, 150, 255, 0.10), transparent 55%),
      radial-gradient(ellipse at 85% 10%, rgba(240, 168, 196, 0.10), transparent 50%),
      radial-gradient(ellipse at 80% 100%, rgba(201, 151, 90, 0.10), transparent 55%);
    color: var(--ink);
    font-family: 'Poor Story', sans-serif;
    min-height: 100vh;
    padding: 0;
  }

  .wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }

  .header { text-align: center; margin-bottom: 28px; }

  .header .eyebrow {
    font-family: 'Gamja Flower', sans-serif;
    font-size: 16px;
    color: var(--gold-text);
    letter-spacing: 0.08em;
    margin: 0 0 8px;
  }

  .header h1 {
    font-family: 'Gamja Flower', sans-serif;
    font-size: 30px;
    font-weight: 400;
    margin: 0 0 12px;
    letter-spacing: 0.02em;
  }

  .header .date { font-size: 13px; color: var(--ink-faint); margin: 0; }

  .divider { height: 1px; background: var(--accent-line); margin: 32px 0; border: none; }

  /* ── 카드 뽑기 전 ───────────────────────── */
  .draw-stage { text-align: center; padding: 24px 0; }

  .card-back {
    width: 140px; height: 220px;
    margin: 0 auto 32px;
    border-radius: 14px;
    background:
      repeating-linear-gradient(135deg, transparent, transparent 8px, rgba(201,151,90,0.10) 8px, rgba(201,151,90,0.10) 9px),
      linear-gradient(160deg, #fdf1e6, #f5e7fb);
    border: 1px solid var(--gold-soft);
    box-shadow: 0 6px 18px rgba(180, 150, 210, 0.18);
    position: relative;
    cursor: pointer;
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .card-back:active { transform: scale(0.97); }
  .card-back::before {
    content: '';
    position: absolute;
    inset: 10px;
    border: 1px solid rgba(201,151,90,0.4);
    border-radius: 8px;
  }
  .card-back .star {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 32px;
    color: var(--gold);
    opacity: 0.75;
  }

  .draw-btn {
    background: transparent;
    border: 1px solid var(--gold-soft);
    color: var(--gold-text);
    font-family: 'Gamja Flower', sans-serif;
    font-size: 16px;
    padding: 12px 32px;
    border-radius: 20px;
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: all 0.25s;
  }
  .draw-btn:hover { background: rgba(201,151,90,0.10); border-color: var(--gold); }
  .draw-btn:active { transform: scale(0.98); }

  .hint { margin-top: 16px; font-size: 12px; color: var(--ink-faint); }

  /* ── 결과 ───────────────────────────────── */
  .result-stage { display: none; }
  .result-stage.show { display: block; animation: fadeUp 0.5s ease; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card-reveal {
    width: 200px; height: 258px;
    margin: 0 auto 24px;
    border-radius: 14px;
    border: 1px solid var(--gold-soft);
    background: linear-gradient(160deg, #fffaf3, #f8f0ff);
    box-shadow: 0 8px 20px rgba(180, 150, 210, 0.16);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    position: relative;
  }
  .card-reveal::before {
    content: '';
    position: absolute;
    inset: 8px;
    border: 1px solid rgba(201,151,90,0.3);
    border-radius: 8px;
  }
  .card-reveal .arcana-num {
    font-size: 13px;
    color: var(--ink-faint);
    letter-spacing: 0.1em;
    margin-bottom: 12px;
  }
  .card-reveal .symbol { font-size: 44px; margin-bottom: 12px; line-height: 1; transition: transform 0.4s ease; }
  .card-reveal .symbol.reversed { transform: rotate(180deg); }
  .card-reveal .name-kr {
    font-family: 'Gamja Flower', sans-serif;
    font-size: 18px;
    font-weight: 400;
    color: var(--gold-text);
    text-align: center;
    margin: 0 0 4px;
    word-break: keep-all;
    overflow-wrap: break-word;
    white-space: normal;
  }
  .card-reveal .name-en {
    font-size: 13px;
    color: var(--ink-dim);
    text-align: center;
    margin: 0;
  }
  .card-reveal .orientation {
    margin-top: 12px;
    font-size: 11px;
    color: var(--ink-faint);
    letter-spacing: 0.08em;
    padding: 3px 10px;
    border: 1px solid var(--border);
    border-radius: 20px;
  }

  .meaning-box {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 18px;
    box-shadow: 0 3px 12px rgba(160, 130, 200, 0.07);
  }
  .meaning-box .label {
    font-family: 'Gamja Flower', sans-serif;
    font-size: 15px;
    color: var(--gold-text);
    margin: 0 0 8px;
  }
  .meaning-box p { font-size: 15.5px; line-height: 1.85; color: var(--ink); margin: 0; }

  .keywords { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
  .keyword-chip {
    font-size: 12px;
    color: var(--ink-dim);
    background: #faf5ff;
    border: 1px solid var(--border);
    padding: 5px 12px;
    border-radius: 20px;
  }

  /* ── 입력 블록 (오늘의 일기) ────────────── */
  .entry-block {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 14px;
    box-shadow: 0 3px 12px rgba(160, 130, 200, 0.06);
  }
  .entry-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .entry-title { font-family: 'Gamja Flower', sans-serif; font-size: 16px; color: var(--ink); }
  .entry-sub { font-size: 12px; color: var(--ink-faint); }

  textarea {
    width: 100%;
    min-height: 90px;
    background: #fdfbff;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--ink);
    font-family: 'Poor Story', sans-serif;
    font-size: 15px;
    line-height: 1.7;
    padding: 14px;
    resize: vertical;
  }
  textarea:focus { outline: none; border-color: var(--gold-soft); }
  textarea::placeholder { color: var(--ink-faint); }

  .save-btn {
    width: 100%;
    background: rgba(201,151,90,0.12);
    border: 1px solid var(--gold-soft);
    color: var(--gold-text);
    font-family: 'Gamja Flower', sans-serif;
    font-size: 15px;
    padding: 11px;
    border-radius: 20px;
    cursor: pointer;
    margin-top: 10px;
  }
  .save-btn:hover { background: rgba(201,151,90,0.2); }

  .save-status {
    text-align: center;
    font-size: 12px;
    color: var(--ink-faint);
    margin: 8px 0 0;
    min-height: 15px;
  }
  .save-status.saved { color: var(--gold-text); }

  .link-btn {
    background: transparent;
    border: none;
    color: var(--gold-text);
    font-family: 'Gamja Flower', sans-serif;
    font-size: 14px;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
    padding: 4px;
  }

  /* ── 정원 달력 (지난 기록) ───────────────── */
  .archive-section { margin-top: 8px; }
  .archive-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .archive-header h2 {
    font-family: 'Gamja Flower', sans-serif;
    font-size: 17px;
    font-weight: 400;
    color: var(--ink-dim);
    margin: 0;
    letter-spacing: 0.03em;
  }
  .archive-count { font-size: 12px; color: var(--ink-faint); }

  .calendar-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    margin-bottom: 14px;
  }
  .cal-nav-btn {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    color: var(--gold-text);
    font-size: 13px;
    width: 28px; height: 28px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }
  .cal-nav-btn:hover { border-color: var(--gold-soft); background: rgba(201,151,90,0.08); }
  .calendar-month-label {
    font-family: 'Gamja Flower', sans-serif;
    font-size: 15px;
    color: var(--ink);
    min-width: 96px;
    text-align: center;
    letter-spacing: 0.02em;
  }

  .calendar-weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    text-align: center;
    font-size: 11px;
    color: var(--ink-faint);
    margin-bottom: 6px;
  }

  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 5px;
  }

  .cal-day {
    aspect-ratio: 1 / 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0;
    font-family: inherit;
    color: var(--ink-dim);
    cursor: default;
  }
  .cal-day.empty-cell { background: transparent; border-color: transparent; }
  .cal-day.has-entry { cursor: pointer; }
  .cal-day.has-entry:hover { border-color: var(--gold-soft); }
  .cal-day.today { border-color: var(--gold); }
  .cal-day.today .cal-date-num { color: var(--gold-text); font-weight: 700; }
  .cal-day .cal-flower { height: 16px; display: flex; align-items: flex-end; justify-content: center; }
  .cal-day .cal-date-num { font-size: 11.5px; line-height: 1; }
  .cal-flower-svg .cal-petal { opacity: 0.95; }

  .empty-archive {
    text-align: center;
    padding: 24px;
    color: var(--ink-faint);
    font-size: 13px;
    border: 1px dashed var(--border);
    border-radius: 8px;
    width: 100%;
    grid-column: 1 / -1;
  }

  .garden-detail {
    margin-top: 16px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 3px 12px rgba(160, 130, 200, 0.07);
    animation: fadeUp 0.35s ease;
  }
  .detail-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; gap: 10px; }
  .detail-date { font-family: 'Gamja Flower', sans-serif; font-size: 15px; color: var(--ink); margin: 0 0 2px; }
  .detail-card { font-family: 'Gamja Flower', sans-serif; font-size: 13px; color: var(--gold-text); margin: 0; }

  .footer-note {
    text-align: center;
    font-size: 13px;
    color: var(--ink-faint);
    margin-top: 48px;
    font-family: 'Gamja Flower', sans-serif;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="header">
    <p class="eyebrow">Daily Tarot</p>
    <h1>오늘의 카드</h1>
    <p class="date" id="today-date"></p>
  </div>

  <hr class="divider">

  <div id="today-section">
    <div class="draw-stage" id="draw-stage">
      <div class="card-back" id="card-back" onclick="drawCard()">
        <span class="star">&#10022;</span>
      </div>
      <button class="draw-btn" onclick="drawCard()">오늘의 조언 카드 뽑기</button>
      <p class="hint">카드를 뽑고, 하루 중 언제든 마음을 적어보세요</p>
    </div>

    <div class="result-stage" id="result-stage">
      <div class="card-reveal">
        <p class="arcana-num" id="arcana-num"></p>
        <div class="symbol" id="card-symbol"></div>
        <p class="name-kr" id="card-name-kr"></p>
        <p class="name-en" id="card-name-en"></p>
        <span class="orientation" id="card-orientation"></span>
      </div>

      <div class="meaning-box">
        <p class="label">오늘의 운세</p>
        <p id="card-meaning"></p>
      </div>

      <div class="keywords" id="card-keywords"></div>

      <div class="entry-block">
        <div class="entry-head">
          <span class="entry-title">&#128221; 오늘의 일기</span>
          <span class="entry-sub">하루 중 언제든 편하게</span>
        </div>
        <textarea id="journal-text" placeholder="이 카드를 보며 떠오른 생각을 적어보세요"></textarea>
        <button class="save-btn" onclick="saveToday()">저장</button>
        <p class="save-status" id="journal-status"></p>
      </div>
    </div>
  </div>

  <hr class="divider">

  <div class="archive-section">
    <div class="archive-header">
      <h2>&#127800; 나의 정원 달력</h2>
      <span class="archive-count" id="archive-count"></span>
    </div>
    <div class="calendar-nav">
      <button class="cal-nav-btn" type="button" onclick="changeMonth(-1)" aria-label="이전 달">&#10094;</button>
      <span class="calendar-month-label" id="calendar-month-label"></span>
      <button class="cal-nav-btn" type="button" onclick="changeMonth(1)" aria-label="다음 달">&#10095;</button>
    </div>
    <div class="calendar-weekdays">
      <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
    </div>
    <div class="calendar-grid" id="calendar-grid"></div>
    <div class="garden-detail" id="garden-detail" hidden></div>
  </div>

  <p class="footer-note">Trust the timing of your life</p>
</div>

<script>
// ── 기기 저장소(localStorage) 어댑터 ──────────────────────────────
// 이 파일이 만들어진 환경에는 window.storage 가 있었지만, 일반 브라우저에는
// 없어서 localStorage 로 대체한다. 데이터는 "이 브라우저 안에만" 저장되며
// 서버로 나가지 않는다.
if (!window.storage) {
  window.storage = {
    async get(key) {
      const value = localStorage.getItem(key);
      return value === null ? null : { value };
    },
    async set(key, value) {
      localStorage.setItem(key, String(value));
      return { ok: true };
    },
    async list(prefix) {
      const keys = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith(prefix)) keys.push(k);
      }
      return { keys };
    }
  };
}
// ─────────────────────────────────────────────────────────────────

const STORAGE_KEY_PREFIX = "tarot_entry_";

const TAROT_DECK = [
  { num: "0", kr: "바보", en: "The Fool", symbol: "🃏", keywords: ["새로운 시작", "순수함", "모험"],
    up: "새로운 시도에 순풍이 부는 하루입니다. 작은 모험이 예상 밖의 수확을 가져올 수 있습니다. 익숙한 길에서 한 발 벗어나, 호기심이 이끄는 쪽으로 움직여 보세요. 완벽한 계획보다 지금 내딛는 첫걸음이 더 많은 걸 알려줍니다. 다만 되돌릴 수 없는 큰 결정은 오늘 하지 말고, 작게 시도하고 빠르게 배우는 하루로 삼으세요.",
    rev: "준비 없이 뛰어들면 발이 걸리기 쉬운 날입니다. 충동적인 선택은 잠시 미뤄두세요. 시작하고 싶은 마음은 진짜지만, 필요한 정보와 최소한의 대비를 건너뛰지 않았는지 돌아보세요. 반대로 겁이 나서 출발을 계속 미루고 있을 수도 있습니다. 오늘 할 수 있는 가장 작은 준비 하나만 끝내 두면, 다음 걸음이 훨씬 가벼워집니다." },

  { num: "I", kr: "마법사", en: "The Magician", symbol: "✨", keywords: ["의지", "창조", "실행력"],
    up: "실행력이 빛나는 하루입니다. 말한 것을 실제로 만들어내는 힘이 강하게 작용합니다. 필요한 재료는 이미 손에 있으니, 새로 갖추길 기다리기보다 지금 가진 것을 어떻게 연결할지 궁리해 보세요. 하루를 시작할 때 오늘 끝낼 한 가지를 분명히 정하고 거기에 집중을 모으면, 예상보다 빨리 결과가 나옵니다. 여러 일을 동시에 벌이면 오히려 힘이 흩어집니다.",
    rev: "초점이 흩어져 에너지가 헛도는 하루가 될 수 있습니다. 방향을 하나로 모으세요. 하려는 일을 전부 적어 본 뒤, 지금 당장 손댈 수 있는 하나만 남기고 나머지는 잠시 미뤄 두세요. 말과 행동이 어긋나면 스스로에 대한 신뢰가 깎입니다. 작더라도 오늘 안에 지킬 수 있는 약속만 입 밖에 내세요." },

  { num: "II", kr: "여사제", en: "The High Priestess", symbol: "🌙", keywords: ["직관", "내면", "침묵"],
    up: "직감이 평소보다 또렷하게 작동하는 날입니다. 밖에서 답을 구하기보다 안에서 이미 알고 있는 것을 확인하세요. 조언을 너무 많이 모으면 오히려 마음이 흐려집니다. 조용한 시간을 잠깐이라도 만들어, 처음 떠오른 직감이 무엇이었는지 적어 보세요. 지금 명확하지 않은 일은 며칠 안에 윤곽이 드러나니, 결정을 내리기보다 관찰하고 기다리는 편이 유리합니다.",
    rev: "무언가 놓치고 있다는 막연한 불안이 따라다닐 수 있는 날입니다. 그 신호의 정체를 들여다보세요. 뭔가 이상하다는 느낌이 드는데 논리로 눌러버리면, 나중에 후회하기 쉽습니다. 겉으로 드러난 정보만 믿기보다, 위화감의 정체를 한 번은 들여다보세요. 반대로 불안이 근거 없이 커진 것일 수도 있으니, 사실과 상상을 종이에 나눠 적어 구분해 보세요." },

  { num: "III", kr: "여황제", en: "The Empress", symbol: "🌸", keywords: ["풍요", "돌봄", "성장"],
    up: "가꿔 온 것들이 열매를 맺기 시작하는, 풍요로운 기운이 감도는 하루입니다. 새로 벌이기보다, 이미 자라고 있는 일이나 관계에 물을 주는 데 시간을 쓰세요. 그 돌봄의 목록에 자신을 꼭 넣으세요. 잘 먹고, 몸을 편하게 하고, 좋아하는 감각을 하나 챙기는 것만으로 여유와 창의력이 살아납니다. 성과를 재촉하지 말고 자라는 속도를 믿어 주세요.",
    rev: "에너지가 밖으로만 쏟아져 내 안이 비어가는 하루일 수 있습니다. 남을 챙기느라 정작 자신은 뒷전이 되어 있진 않은지 돌아보세요. 도움을 주더라도 한계를 정하고, 여기까지라고 말하는 연습을 해 보세요. 반대로 스스로를 지나치게 방치해 몸과 마음이 메말라 있을 수도 있습니다. 물 한 잔, 산책 십 분처럼 작은 보살핌부터 오늘 시작하세요." },

  { num: "IV", kr: "황제", en: "The Emperor", symbol: "🏛️", keywords: ["질서", "안정", "책임"],
    up: "구조와 질서가 힘을 발휘하는 안정적인 하루입니다. 흐트러진 것에 뼈대를 세우기 좋은 날입니다. 미뤄 둔 규칙, 일정, 경계선을 분명히 정하면 마음이 한결 안정됩니다. 큰 목표를 눈앞의 절차로 잘게 나누고, 오늘 지킬 기준 하나를 스스로에게 약속하세요. 다른 사람에게도 필요한 선은 정중하지만 분명하게 그으세요. 즉흥보다 계획이 빛나는 하루입니다.",
    rev: "지나친 통제가 자신과 주변을 경직시킬 수 있는 날입니다. 유연함이 필요합니다. 규칙이 목적을 잃고 규칙 자체가 되어버리면 숨이 막힙니다. 이건 꼭 이래야 한다고 믿는 것 중 하나를 의심해 보세요. 반대로 기준이 아예 없어 이리저리 휘둘리는 상태일 수도 있습니다. 그렇다면 사소한 것 하나라도 오늘은 이렇게 한다고 정해 두는 데서 질서가 생깁니다." },

  { num: "V", kr: "교황", en: "The Hierophant", symbol: "📜", keywords: ["전통", "조언", "배움"],
    up: "경험 있는 사람의 조언이 길을 열어주는 하루입니다. 혼자 풀기 전에 먼저 물어보세요. 검증된 절차나 매뉴얼이 있다면 오늘은 그대로 따라 보세요. 배움을 청하는 것은 약함이 아니라 지름길입니다. 조언해 줄 만한 사람에게 구체적인 질문 하나를 준비해 연락해 보세요. 내가 속한 곳의 규범과 내 가치가 맞닿는 지점을 확인하는 것도 의미 있습니다.",
    rev: "관습이나 남의 기대에 끌려다니기 쉬운 날입니다. 내 기준부터 점검하세요. 원래 그렇게 하는 거라는 말이 오늘은 답이 되지 않습니다. 왜 그렇게 하는지 스스로 납득한 뒤에 따르세요. 반대로 조언을 전부 튕겨내고 있다면, 신뢰할 만한 한 사람의 말은 오늘 한 번 끝까지 들어 보세요." },

  { num: "VI", kr: "연인", en: "The Lovers", symbol: "💞", keywords: ["선택", "관계", "조화"],
    up: "중요한 선택이 눈앞에 놓일 수 있는 날입니다. 마음의 나침반을 따르세요. 조건을 저울질하기 전에, 어느 쪽이 나다운 선택인지를 먼저 보세요. 관계에서는 미뤄 둔 진심을 솔직하게 전하기 좋은 때입니다. 상대의 마음을 넘겨짚지 말고 직접 묻고 말하세요. 어중간하게 걸쳐 두기보다 한쪽을 분명히 택할 때 마음이 가벼워집니다.",
    rev: "결정을 미루는 사이 양쪽 모두 흐려지기 쉬운 날입니다. 애매한 상태가 에너지를 갉아먹습니다. 결정을 어렵게 하는 진짜 이유가 두려움인지 정보 부족인지 적어 보세요. 관계에서는 가치관이 어긋난 부분을 덮어두고 있을 수 있습니다. 불편해도 그 지점을 한 번은 말로 꺼내야 다음이 있습니다." },

  { num: "VII", kr: "전차", en: "The Chariot", symbol: "🐎", keywords: ["추진력", "의지", "승리"],
    up: "강한 추진력으로 일이 빠르게 진전되는 하루입니다. 망설임을 내려놓고 밀고 나가세요. 흔들리는 마음과 산만한 유혹을 한쪽으로 몰아, 정한 목표에 속도를 내세요. 상반된 감정이 있어도 괜찮습니다. 둘 다 인정하되 지금은 한 방향으로 고삐를 잡으면 됩니다. 오늘 낸 추진력이 다음 며칠의 흐름을 만듭니다.",
    rev: "마음이 여러 방향으로 끌려 앞으로 나아가기 어려운 날입니다. 잠깐 멈추고 방향을 정하세요. 액셀과 브레이크를 동시에 밟는 상태일 수 있습니다. 목표를 너무 크게 잡았다면 오늘 도달할 지점까지만 좁혀 보세요. 감정에 휘둘려 무리하게 돌진하는 경우도 조심해야 합니다. 잠깐 멈춰 방향을 확인한 뒤 다시 출발해도 늦지 않습니다." },

  { num: "VIII", kr: "힘", en: "Strength", symbol: "🦁", keywords: ["인내", "용기", "온화함"],
    up: "부드러운 힘이 강한 힘을 이기는 하루입니다. 조급함 대신 차분한 대응이 좋은 결과를 만듭니다. 화가 나거나 조급해지는 순간, 반응하기 전에 한 박자 쉬어 보세요. 어려운 대화나 참을성이 필요한 일이 있다면 오늘은 잘 풀리는 날입니다. 자신의 약한 부분도 다그치지 말고 따뜻하게 데리고 가세요. 인내가 곧 실력이 됩니다.",
    rev: "감정을 억누르느라 안에서 소모되고 있는 하루일 수 있습니다. 참는 것과 외면하는 것은 다릅니다. 화나 두려움의 원인을 솔직히 인정하는 데서 힘이 회복됩니다. 반대로 사소한 일에 쉽게 폭발하고 있다면, 지금 몸이 지쳤다는 신호일 수 있습니다. 무리한 일정을 하나 덜고, 자신에게 너그러워지는 것부터 오늘의 과제로 삼으세요." },

  { num: "IX", kr: "은둔자", en: "The Hermit", symbol: "🏮", keywords: ["성찰", "고독", "탐구"],
    up: "고요한 시간 속에서 답이 떠오르는 하루입니다. 밖의 소음에서 잠시 물러나 보세요. 답을 찾으러 여기저기 묻고 다니기보다, 조용한 곳에서 스스로에게 질문을 던져 보세요. 이미 알고 있지만 인정하지 않은 것이 떠오를 수 있습니다. 약속을 하나 줄이고 그 시간을 산책이나 기록에 쓰세요. 지금의 고요는 외로움이 아니라 정리의 시간입니다.",
    rev: "혼자만의 시간이 고립으로 굳어질 수 있는 날입니다. 누군가에게 말을 걸어보세요. 생각이 같은 자리를 맴돈다면, 신뢰하는 한 사람에게 상황을 말로 꺼내 보세요. 밖의 빛이 들어와야 보이는 것이 있습니다. 반대로 너무 바빠 자신을 들여다볼 틈이 없었다면, 오늘 십 분이라도 화면을 끄고 혼자 앉아 보세요." },

  { num: "X", kr: "운명의 수레바퀴", en: "Wheel of Fortune", symbol: "🎡", keywords: ["전환점", "순환", "기회"],
    up: "흐름이 바뀌는 전환점에 서 있는 하루입니다. 예상 밖의 기회가 찾아올 수 있습니다. 모든 것을 계획대로 붙들려 하기보다, 변화에 유연하게 올라타는 편이 유리합니다. 갑자기 들어온 기회나 연락을 무시하지 말고 한 번은 살펴보세요. 지금 잘 안 풀리는 일도 곧 국면이 달라질 수 있으니 성급히 끝내지 마세요.",
    rev: "흐름이 정체되어 답답함이 느껴질 수 있는 날입니다. 같은 패턴을 반복하고 있진 않은지 돌아보세요. 억지로 되돌리려 애쓰기보다, 매번 비슷한 지점에서 걸린다면 그 고리를 끊을 작은 변화 하나를 시도해 보세요. 운이 나쁘다고 단정하기 전에, 바뀔 때까지 기다릴 여유를 스스로에게 주세요." },

  { num: "XI", kr: "정의", en: "Justice", symbol: "⚖️", keywords: ["균형", "공정", "결정"],
    up: "공정한 판단이 좋은 결과로 이어지는 하루입니다. 감정보다 사실을 먼저 놓고 보세요. 판단이 필요한 일이 있다면, 양쪽 입장을 종이에 나눠 적어 냉정하게 견줘 보세요. 지난 선택의 결과가 지금 돌아오고 있을 수 있습니다. 책임질 부분은 인정하고, 바로잡을 것은 미루지 말고 오늘 손보세요. 솔직한 태도가 신뢰를 만들고, 그 신뢰가 다음 기회를 엽니다.",
    rev: "판단이 한쪽으로 기울기 쉬운 날입니다. 내게 유리한 해석만 하고 있진 않은지 점검하세요. 남 탓으로 돌리고 싶은 일에서 내 몫이 얼마인지 정직하게 따져 보세요. 반대로 필요 이상으로 자신을 몰아세우고 있다면, 책임의 범위를 사실에 맞게 다시 그으세요. 공정함은 남에게도 나에게도 같게 적용되어야 합니다." },

  { num: "XII", kr: "매달린 사람", en: "The Hanged Man", symbol: "🌀", keywords: ["기다림", "관점전환", "내려놓음"],
    up: "멈춤이 오히려 해답이 되는 하루입니다. 무리하게 밀어붙이기보다 관점을 바꿔보세요. 하던 방식이 안 통한다면 손을 놓고, 문제를 반대편에서 바라보세요. 기다려야 하는 일은 조급해하지 말고 그대로 두세요. 통제하려던 것을 하나 내려놓으면, 예상치 못한 해결의 실마리가 보입니다. 오늘의 정지는 후퇴가 아닙니다.",
    rev: "불필요한 기다림이 길어지고 있는 날입니다. 붙들고 있는 것을 놓을 때가 됐을 수 있습니다. 희생하고 있다는 느낌만 쌓이고 아무것도 바뀌지 않는다면, 오늘은 그 상태에서 내려올 때입니다. 무엇을 붙들고 있는지, 그것을 놓으면 정말 무슨 일이 생기는지 적어 보세요. 잠깐 멈춰야 할 일을 억지로 밀어붙이고 있다면, 오늘 하루는 판단을 보류하세요." },

  { num: "XIII", kr: "죽음", en: "Death", symbol: "🦋", keywords: ["끝과 시작", "변화", "재생"],
    up: "끝맺음이 새로운 시작을 여는 하루입니다. 마무리해야 할 것이 있다면 오늘 정리하세요. 이미 생명이 다한 일, 관계, 습관을 붙들고 있는 손을 놓기 좋은 날입니다. 아쉬움이 남더라도 억지로 되살리려 하기보다 잘 마무리하는 데 힘을 쓰세요. 끝을 인정하면 그 자리에 새로운 것이 들어올 공간이 생깁니다. 변화는 이미 시작됐습니다.",
    rev: "변화를 거부하느라 에너지가 소모되는 하루일 수 있습니다. 끝난 걸 알면서도 놓지 못해 변화가 계속 미뤄지고 있진 않나요. 무엇이 두려워 붙들고 있는지 들여다보세요. 완전히 끊어내는 게 부담이라면, 오늘은 아주 작은 것 하나만 정리해도 됩니다. 낡은 것을 조금씩 비워야 멈춰 있던 흐름이 다시 움직입니다." },

  { num: "XIV", kr: "절제", en: "Temperance", symbol: "🌊", keywords: ["균형", "조율", "인내"],
    up: "균형과 조화가 하루를 편안하게 이끄는 날입니다. 극단을 피하고 중간 지점을 찾으세요. 일과 쉼, 말과 침묵, 주는 것과 받는 것 사이에서 알맞은 비율을 찾아보세요. 서로 다른 요구나 의견이 있다면, 둘을 섞는 방법을 궁리하면 길이 보입니다. 급하게 몰아붙이기보다 알맞은 속도로 꾸준히 가는 것이 더 멀리 갑니다.",
    rev: "생활의 균형이 무너져 한쪽으로 쏠리기 쉬운 날입니다. 과하게 쓰고 있는 것 하나를 줄여보세요. 일만, 혹은 걱정만, 혹은 참기만 하며 균형이 무너진 상태일 수 있습니다. 비어 있는 쪽에 조금 채워 넣으세요. 조급함 때문에 무리하게 속도를 내다 실수가 나올 수도 있으니, 한 템포 늦추는 것이 오히려 빠른 길입니다." },

  { num: "XV", kr: "악마", en: "The Devil", symbol: "⛓️", keywords: ["집착", "속박", "그림자"],
    up: "나를 묶고 있는 것의 정체를 직시할 수 있는 하루입니다. 그 사슬은 생각보다 느슨합니다. 끊어야 하는 걸 알면서 반복하는 습관, 의무감뿐인 관계, 어쩔 수 없다는 말버릇을 하나 떠올려 보세요. 벗어날 힘이 없는 게 아니라 아직 안 쓴 것뿐입니다. 오늘 그 고리에서 반 발짝만 빠져나오는 행동 하나를 해 보세요.",
    rev: "오래된 속박에서 벗어나기 시작하는 전환의 기운이 도는 날입니다. 그동안 당연하다고 여겼던 제약 하나에 의문을 던져 보세요. 사실은 내가 선택할 수 있었던 것임을 알아차리는 순간, 힘의 방향이 바뀝니다. 다만 오래된 습관은 한 번에 사라지지 않으니, 자신을 몰아세우지 말고 벗어나는 과정에 시간을 허락하세요." },

  { num: "XVI", kr: "탑", en: "The Tower", symbol: "⚡", keywords: ["급변", "붕괴", "각성"],
    up: "예상치 못한 변화가 찾아올 수 있는 하루입니다. 흔들리는 것은 원래 약했던 곳입니다. 갑작스러운 변화가 당황스럽겠지만, 방어하거나 덮으려 애쓰기보다 드러난 사실을 인정하는 편이 낫습니다. 붙잡을 수 없는 것은 놓고, 지금 확실한 것 하나에 발을 딛으세요. 지나고 나면 이 자리에 더 단단한 것이 세워집니다.",
    rev: "보이지 않는 곳에 균열이 쌓이고 있는 날입니다. 미루기보다 지금 들여다보세요. 이미 금이 간 곳을 계속 덧대기만 하면 나중에 더 크게 무너집니다. 두렵더라도 문제의 핵심을 한 번 들여다보고, 스스로 정리할 수 있는 것부터 손대세요. 위기가 지나가는 중일 수도 있으니, 최악을 넘겼다면 서서히 숨을 고르며 복구를 시작하세요." },

  { num: "XVII", kr: "별", en: "The Star", symbol: "⭐", keywords: ["희망", "치유", "영감"],

  { num: "XIX", kr: "태양", en: "The Sun", symbol: "☀️", keywords: ["성취", "활력", "기쁨"],

  { num: "XX", kr: "심판", en: "Judgement", symbol: "🎺", keywords: ["각성", "재평가", "부름"],

  { num: "XXI", kr: "세계", en: "The World", symbol: "🌍", keywords: ["완성", "성취", "통합"],

  { num: "완드 2", kr: "완드 2", en: "Two of Wands", symbol: "🗺️", keywords: ["계획", "다음 단계", "시야 넓히기"],

  { num: "완드 4", kr: "완드 4", en: "Four of Wands", symbol: "🎉", keywords: ["축하", "화합", "성취의 쉼"],

  { num: "완드 5", kr: "완드 5", en: "Five of Wands", symbol: "🥊", keywords: ["경쟁", "충돌", "의견 차이"],

  { num: "완드 7", kr: "완드 7", en: "Seven of Wands", symbol: "🛡️", keywords: ["방어", "입장 고수", "버팀"],

  { num: "완드 9", kr: "완드 9", en: "Nine of Wands", symbol: "🧱", keywords: ["경계", "인내", "마지막 힘"],
    up: "지치지만 거의 다 온 하루입니다. 마지막 한 번만 더 버텨보세요. 지금까지 겪어온 어려움이 오히려 지금의 단단함을 만들어 준 것이니, 그 경험을 믿고 조금만 더 힘을 내세요. 다만 지나친 경계심으로 도움의 손길마저 밀어내지는 마세요. 마지막 고비일수록 곁에 있는 사람의 도움을 받아들이는 것도 지혜입니다.",
    rev: "소진의 경고등이 켜진 하루입니다. 버티기보다 회복이 먼저입니다. 무너질까 봐 두려워 계속 방어만 하고 있진 않은지 살펴보세요. 잠깐 무장을 내려놓아도 당장 무너지지 않습니다. 쉬는 것을 포기로 여기지 마세요. 오늘 하루는 버티기보다 회복에 힘을 쓰는 편이 더 멀리 가는 길입니다." },

  { num: "완드 10", kr: "완드 10", en: "Ten of Wands", symbol: "🪵", keywords: ["부담", "과부하", "책임의 무게"],
    up: "짊어진 짐이 무거운 하루이지만, 목적지는 가까이 있습니다. 짐을 좀 나누세요. 그 짐들이 대부분 내가 원해서, 혹은 잘 해내고 싶어서 떠안은 것들이라는 걸 인정하세요. 전부 혼자 짊어질 필요가 없습니다. 나눌 수 있는 일은 나누고, 굳이 안 해도 되는 일은 내려놓으세요.",
    rev: "한계를 넘어 짊어지고 있는 것이 있는 하루입니다. 내 몫인지 아닌지 가려보세요. 책임감이 때로는 불필요한 짐까지 끌어안게 만듭니다. 지고 있는 것들을 하나씩 적어 보고, 정말 내 몫인지 아닌지 가려 보세요. 하나라도 내려놓는 순간, 생각보다 숨쉬기가 훨씬 편해질 겁니다." },

  { num: "완드 시종", kr: "완드 시종", en: "Page of Wands", symbol: "🕯️", keywords: ["탐험", "배움의 시작", "설렘"],
    up: "호기심이 마음을 두드리는 설레는 하루입니다. 낯선 것에 발을 담가보세요. 아직 서툴러도 괜찮으니, 관심 가는 분야에 발끝만이라도 담가 보세요. 오늘의 작은 시도가 나중에 어디로 이어질지는 아무도 모릅니다. 실패를 두려워하기보다 낯선 것을 즐기는 마음으로 접근하면, 생각보다 재미있는 하루가 됩니다.",
    rev: "호기심은 반짝이지만 금방 식어버리기 쉬운 하루입니다. 이번엔 끝까지 해보겠다는 기준을 세우세요. 새로운 걸 벌여놓고 금방 흥미를 잃어버리는 패턴이 반복되고 있진 않나요. 계획 없이 뛰어드는 설렘도 좋지만, 그 설렘이 오래가려면 최소한의 꾸준함이 필요합니다." },

  { num: "완드 기사", kr: "완드 기사", en: "Knight of Wands", symbol: "🌪️", keywords: ["돌진", "열정", "충동적 행동"],
    up: "몸이 먼저 움직이는 강한 추진력의 하루입니다. 정체된 일을 뚫기 좋은 때입니다. 망설이지 말고 과감하게 밀어붙여 보세요. 다만 속도에 취해 중요한 디테일을 놓치지 않도록, 움직이기 직전에 한 번만 점검하는 습관을 더하세요. 열정이 무모함으로 넘어가지 않게 하는 최소한의 안전장치입니다.",
    rev: "벌여놓은 일이 정리보다 빠르게 쌓이는 하루일 수 있습니다. 새로 시작보다 마무리가 먼저입니다. 충동적으로 내뱉은 말이나 급하게 내린 결정이 있다면 다시 한번 들여다볼 필요도 있습니다. 속도를 줄이는 것이 오늘은 후퇴가 아니라 정비입니다." },

  { num: "완드 여왕", kr: "완드 여왕", en: "Queen of Wands", symbol: "🌻", keywords: ["자신감", "카리스마", "따뜻한 독립성"],
    up: "자신의 매력이 자연스럽게 빛나는 하루입니다. 눈치 보지 말고 당당하게 나서세요. 자신의 색깔을 자연스럽게 내보이세요. 그 당당함이 주변 사람들에게도 좋은 에너지로 전해질 수 있습니다. 동시에 곁에 있는 사람을 따뜻하게 챙기는 여유도 함께 발휘해 보세요. 자신감과 다정함이 함께 있을 때 존재감이 가장 빛납니다.",
    rev: "자신감이 흔들리거나 반대로 지나치게 앞서는 하루일 수 있습니다. 균형을 맞춰보세요. 스스로를 낮추지도, 남을 누르지도 않는 지점을 찾아보세요. 질투나 경쟁심이 자꾸 올라온다면, 그 감정 밑에 있는 진짜 욕구가 무엇인지부터 들여다보는 게 먼저입니다." },

  { num: "완드 왕", kr: "완드 왕", en: "King of Wands", symbol: "🧭", keywords: ["리더십", "비전", "결단력"],
    up: "큰 그림을 그리고 방향을 제시하기 좋은 하루입니다. 확신을 갖고 이끌어보세요. 눈앞의 작은 일보다 방향을 정하는 데 집중해 보세요. 확신을 갖고 말하면 주변도 그 방향을 따라 움직이기 시작합니다. 다만 혼자 모든 걸 결정하기보다, 함께할 사람들의 의견도 들을 여유를 남겨 두세요.",
    rev: "결단을 미루거나 독단적으로 밀어붙이기 쉬운 하루입니다. 한 사람의 의견만이라도 더 들어보세요. 리더십은 혼자 다 짊어지는 것이 아니라, 방향을 제시하고 함께 갈 사람을 신뢰하는 데서 나옵니다." },

  /* ── 마이너 아르카나: 컵(잔) ── */
  { num: "컵 에이스", kr: "컵 에이스", en: "Ace of Cups", symbol: "💧", keywords: ["새 감정", "사랑", "마음의 시작"],
    up: "마음속에 새로운 감정이 차오르는 하루입니다. 사랑, 우정, 감사 어떤 형태든 받아들이세요. 누군가에게 마음을 여는 것이 어색하더라도, 오늘은 솔직한 표현이 좋은 결과를 가져옵니다. 감정을 억누르지 말고 흘러가게 두세요. 새로운 관계의 시작이 될 수도 있고, 기존 관계가 한층 깊어질 수도 있습니다.",
    rev: "감정이 막혀 있거나 마음을 닫고 있는 하루일 수 있습니다. 왜 마음을 열기 어려운지 들여다보세요. 과거의 상처가 새로운 감정을 받아들이는 걸 막고 있을 수 있습니다. 억지로 감정을 끌어올리려 하지 말고, 지금 느끼는 그대로를 인정하는 것부터 시작하세요. 마음이 준비되면 자연스럽게 열립니다." },

  { num: "컵 2", kr: "컵 2", en: "Two of Cups", symbol: "🤝", keywords: ["연결", "파트너십", "상호 존중"],
    up: "마음이 통하는 연결이 만들어지는 하루입니다. 진심 어린 대화가 관계를 깊게 합니다. 일대일 관계에서 좋은 흐름이 있을 수 있습니다. 상대의 말을 끝까지 듣고, 내 마음도 솔직하게 전해 보세요. 서로 다른 점을 인정하면서 공통점에 집중하면, 오늘 나눈 대화가 오래 기억에 남습니다.",
    rev: "관계에서 균형이 어긋나 한쪽만 애쓰는 느낌이 드는 날입니다. 그 불균형을 짚어보세요. 주고받음이 한쪽으로 쏠려 있다면, 오늘은 그 패턴을 한 번 말로 꺼내볼 필요가 있습니다. 억지로 맞추려 하기보다, 서로에게 필요한 것이 무엇인지 솔직하게 확인하는 게 먼저입니다." },

  { num: "컵 3", kr: "컵 3", en: "Three of Cups", symbol: "🥂", keywords: ["우정", "축하", "함께하는 기쁨"],
    up: "사람들과 어울리며 기쁨이 커지는 하루입니다. 좋아하는 사람들과 시간을 보내세요. 작은 모임이나 축하의 자리가 에너지를 채워줍니다. 혼자 끙끙 앓던 고민도 친구와 나누면 가벼워질 수 있습니다. 오늘은 효율보다 즐거움에 시간을 쓰는 게 결국 더 많은 걸 얻게 합니다.",
    rev: "사람들 속에서 오히려 외로움을 느끼거나, 모임이 부담스러운 하루일 수 있습니다. 억지로 어울리지 않아도 됩니다. 피곤한 관계에서 한 발 물러나 혼자만의 시간을 갖는 것도 오늘은 괜찮습니다. 소속감이 흔들리고 있다면, 정말 편한 한 사람에게만 연락해 보세요." },

  { num: "컵 4", kr: "컵 4", en: "Four of Cups", symbol: "😶", keywords: ["무관심", "권태", "내면 성찰"],
    up: "주어진 것에 시큰둥하고 마음이 동하지 않는 하루일 수 있습니다. 그 권태 속에 메시지가 있습니다. 지금 불만족스러운 이유가 진짜 상황 때문인지, 마음의 눈이 닫혀 있는 것인지 구분해 보세요. 새로운 기회가 눈앞에 있는데 관심을 두지 않고 있을 수 있습니다. 시야를 살짝만 바꿔보세요.",
    rev: "무기력에서 벗어나 다시 움직이기 시작하는 흐름이 느껴지는 날입니다. 놓치고 있던 기회를 다시 살펴보세요. 그동안 무심히 지나쳤던 제안이나 가능성이 지금 다시 보일 수 있습니다. 완벽하지 않아도 일단 손을 뻗어보세요. 행동이 감정을 바꿔줄 수 있습니다." },

  { num: "컵 5", kr: "컵 5", en: "Five of Cups", symbol: "😢", keywords: ["상실", "후회", "남은 것"],
    up: "잃어버린 것에 마음이 쏠리기 쉬운 하루입니다. 하지만 아직 남아 있는 것도 보세요. 후회나 아쉬움이 마음을 무겁게 하더라도, 쏟아진 물만 바라보면 아직 서 있는 잔을 놓칩니다. 오늘은 슬퍼도 괜찮지만, 슬픔에 오래 머무르기보다 아직 가진 것 하나에 시선을 돌려보세요. 거기서 다음이 시작됩니다.",
    rev: "상실의 아픔에서 조금씩 고개를 드는 시점입니다. 받아들임이 회복의 첫걸음입니다. 지난 일을 완전히 잊을 필요는 없지만, 이제 앞을 바라볼 준비가 되어가고 있습니다. 오래된 후회를 하나 내려놓고, 오늘 새롭게 시도할 수 있는 것 하나를 찾아보세요." },

  { num: "컵 6", kr: "컵 6", en: "Six of Cups", symbol: "🧸", keywords: ["추억", "순수함", "과거와의 연결"],
    up: "따뜻한 추억이 마음을 감싸는 하루입니다. 옛 인연이나 그리운 것들과 다시 이어질 수 있습니다. 오랫동안 연락하지 않았던 사람에게 안부를 건네거나, 어릴 적 좋아했던 것을 다시 해보세요. 과거에서 지금의 나를 위로할 무언가를 발견할 수 있습니다. 순수한 마음으로 돌아가는 시간을 가져보세요.",
    rev: "과거에 매여 현재가 보이지 않는 하루일 수 있습니다. 그때는 좋았는데라는 생각에 갇히지 마세요. 추억을 미화하며 지금을 깎아내리고 있진 않은지 돌아보세요. 과거의 좋았던 감정은 간직하되, 발은 오늘 위에 두세요. 지금 이 자리에서도 만들 수 있는 좋은 순간이 있습니다." },

  { num: "컵 7", kr: "컵 7", en: "Seven of Cups", symbol: "🌈", keywords: ["환상", "선택지", "현실 점검"],
    up: "매력적인 가능성이 여럿 떠오르는 하루입니다. 다만 전부 진짜인지 현실 점검이 필요합니다. 상상과 환상이 풍부한 날이지만, 그 중 실현 가능한 것을 골라내는 눈이 중요합니다. 가장 마음이 끌리는 것 하나를 정한 뒤, 오늘 할 수 있는 확인 작업 하나만 해 보세요. 꿈꾸되 발은 땅에 두세요.",
    rev: "환상에서 깨어나 현실을 직시하는 날입니다. 뜬구름 같은 계획을 정리할 때입니다. 이것저것 벌려놓은 것 중 진짜 할 것과 놓을 것을 구분해 보세요. 하나에 집중하기로 결정하는 것 자체가 오늘의 가장 큰 진전입니다. 선택지를 줄이면 오히려 마음이 편해집니다." },

  { num: "컵 8", kr: "컵 8", en: "Eight of Cups", symbol: "🚶", keywords: ["떠남", "포기가 아닌 전환", "더 깊은 의미 찾기"],
    up: "익숙하지만 더 이상 채워지지 않는 것에서 걸어 나올 수 있는 하루입니다. 떠남이 곧 성장입니다. 겉으로는 괜찮아 보여도 마음이 비어 있다면, 오늘은 그 빈자리를 인정하세요. 더 의미 있는 것을 찾아 방향을 틀 용기가 필요한 날입니다. 남들이 아깝다고 해도, 자신의 마음이 이미 답을 알고 있습니다.",
    rev: "떠나야 할지 머물러야 할지 갈피를 못 잡는 하루일 수 있습니다. 지금 이 자리가 정말 끝인지 다시 살펴보세요. 불만족이 일시적인 감정인지, 오래된 신호인지 구분해 보세요. 성급하게 떠나기보다, 오늘은 왜 떠나고 싶은지를 먼저 적어 보세요. 진짜 이유를 알아야 다음 선택이 정확해집니다." },

  { num: "컵 9", kr: "컵 9", en: "Nine of Cups", symbol: "😊", keywords: ["만족", "소원 성취", "감사"],
    up: "바라던 것이 이루어지는 만족스러운 하루입니다. 지금 이 순간을 충분히 누리세요. 큰 성취가 아니더라도, 오늘은 작은 것에서 행복을 느끼기 좋은 날입니다. 좋아하는 음식, 편안한 시간, 마음 맞는 사람과의 대화만으로도 충분합니다. 더 바라기보다 이미 가진 것에 감사하면, 만족감이 오래갑니다.",
    rev: "원하는 걸 얻었는데도 어딘가 허전한 하루일 수 있습니다. 진짜 원하는 게 이것이었는지 돌아보세요. 겉으로 보이는 성취와 마음속 진짜 바람이 다를 수 있습니다. 남에게 보여주기 위한 만족이 아니라, 내가 진심으로 기뻐하는 것이 무엇인지 질문해 보세요." },

  { num: "컵 10", kr: "컵 10", en: "Ten of Cups", symbol: "🌈", keywords: ["행복", "조화", "정서적 완성"],

  { num: "컵 왕", kr: "컵 왕", en: "King of Cups", symbol: "🐋", keywords: ["감정 통제", "지혜", "차분한 리더십"],

    up: "일상을 풍요롭게 가꾸는 능력이 빛나는 하루입니다. 현실적인 돌봄이 힘을 발휘합니다. 집안을 정리하거나, 건강한 식사를 챙기거나, 재정을 점검하는 것처럼 실용적인 일에 에너지를 쓰세요. 사소한 것 같지만 이런 돌봄이 삶의 기반을 튼튼하게 만듭니다. 자신과 주변을 실질적으로 챙기세요.",
    rev: "현실적인 일에 매몰되어 자신을 돌보지 못하는 하루일 수 있습니다. 효율만 쫓다 지치고 있진 않은지 살펴보세요. 남을 챙기느라 정작 내 건강이나 여유는 뒷전이 되어 있을 수 있습니다. 오늘은 생산적이지 않아도 되는 시간을 의식적으로 만드세요." },

  { num: "펜타클 왕", kr: "펜타클 왕", en: "King of Pentacles", symbol: "👑", keywords: ["경제적 안정", "신뢰", "현실적 리더십"],
    up: "안정적인 판단력으로 현실적인 성과를 만들 수 있는 하루입니다. 경험에서 나오는 자신감을 믿으세요. 재정, 건강, 커리어 등 현실적인 영역에서 확실한 결정을 내리기 좋은 날입니다. 장기적인 관점에서 선택하세요. 화려한 도박보다 검증된 방법이 오늘은 더 큰 결과를 가져옵니다.",
    rev: "물질적 안정에 지나치게 매달리거나, 변화를 거부하는 하루일 수 있습니다. 안전한 선택만 하다 보면 성장이 멈춥니다. 가진 것을 지키는 것도 중요하지만, 적절한 투자 없이는 더 나아갈 수 없습니다. 오늘은 약간의 모험을 허락해도 됩니다." },
];

/* ── 유틸 ─────────────────────────────────── */
function getTodayKey() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

function formatDateKR(dateStr) {
  const parts = dateStr.split("-").map(Number);
  const dt = new Date(parts[0], parts[1] - 1, parts[2]);
  const days = ["일", "월", "화", "수", "목", "금", "토"];
  return parts[0] + "년 " + parts[1] + "월 " + parts[2] + "일 (" + days[dt.getDay()] + ")";
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str == null ? "" : str;
  return div.innerHTML;
}

function meaningText(card) {
  const base = TAROT_DECK.find(function (c) { return c.num === card.num; }) || {};
  return card.reversed ? (base.rev || "") : (base.up || "");
}

function keywordsOf(card) {
  const base = TAROT_DECK.find(function (c) { return c.num === card.num; }) || {};
  return base.keywords || [];
}

// 그 날의 일기 내용을 꺼낸다. 예전 버전(아침 한 줄 + 밤 회고로 나뉘어 있던 구조)으로
// 저장된 기록도 그대로 이어서 볼 수 있도록, note가 없으면 옛 필드를 이어붙여 보여준다.
function journalTextOf(entry) {
  if (!entry) return "";
  if (entry.note != null) return entry.note;
  return [entry.morning, entry.evening].filter(Boolean).join("\n\n");
}

async function persist(entry) {
  try {
    await window.storage.set(STORAGE_KEY_PREFIX + entry.date, JSON.stringify(entry));
  } catch (e) {
    console.error("저장 실패", e);
  }
}

function flashStatus(id, msg) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = msg;
  el.classList.add("saved");
  setTimeout(function () { el.textContent = ""; el.classList.remove("saved"); }, 1800);
}

/* ── 상태 ─────────────────────────────────── */
let currentEntry = null;

function renderToday() {
  const drawStage = document.getElementById("draw-stage");
  const resultStage = document.getElementById("result-stage");

  if (!currentEntry || !currentEntry.card) {
    drawStage.style.display = "block";
    resultStage.classList.remove("show");
    return;
  }

  drawStage.style.display = "none";
  const card = currentEntry.card;

  document.getElementById("arcana-num").textContent = card.num;
  const symEl = document.getElementById("card-symbol");
  symEl.textContent = card.symbol;
  symEl.classList.toggle("reversed", !!card.reversed);
  document.getElementById("card-name-kr").textContent = card.kr;
  document.getElementById("card-name-en").textContent = card.en;
  document.getElementById("card-orientation").textContent = card.reversed ? "역방향" : "정방향";
  document.getElementById("card-meaning").textContent = meaningText(card);

  const kw = document.getElementById("card-keywords");
  kw.innerHTML = "";
  keywordsOf(card).forEach(function (k) {
    const s = document.createElement("span");
    s.className = "keyword-chip";
    s.textContent = k;
    kw.appendChild(s);
  });

  document.getElementById("journal-text").value = journalTextOf(currentEntry);

  resultStage.classList.add("show");
}

function pickRandomCard() {
  const c = TAROT_DECK[Math.floor(Math.random() * TAROT_DECK.length)];
  return {
    num: c.num, kr: c.kr, en: c.en, symbol: c.symbol,
    reversed: Math.random() < 0.35,
  };
}

async function drawCard() {
  if (currentEntry && currentEntry.card) return;

  const cardBack = document.getElementById("card-back");
  if (cardBack) {
    cardBack.style.transform = "scale(0.92) rotateY(15deg)";
    setTimeout(function () { cardBack.style.transform = ""; }, 180);
  }

  const picked = pickRandomCard();
  const now = new Date().toISOString();
  currentEntry = {
    date: getTodayKey(),
    card: picked,
    drawnAt: now,
    note: "", noteAt: null,
    savedAt: now,
  };
  await persist(currentEntry);

  setTimeout(function () {
    renderToday();
    loadGarden();
  }, 220);
}

async function saveToday() {
  if (!currentEntry) return;
  const val = document.getElementById("journal-text").value.trim();
  currentEntry.note = val;
  currentEntry.noteAt = new Date().toISOString();
  currentEntry.savedAt = new Date().toISOString();
  await persist(currentEntry);
  flashStatus("journal-status", val ? "저장했어요" : "지웠어요");
  renderToday();
  loadGarden();
}

/* ── 정원 (지난 기록) ─────────────────────── */
async function readAllEntries() {
  let entries = [];
  try {
    const r = await window.storage.list(STORAGE_KEY_PREFIX);
    const keys = (r && r.keys) || [];
    for (const k of keys) {
      try {
        const rr = await window.storage.get(k);
        if (rr && rr.value) entries.push(JSON.parse(rr.value));
      } catch (e) { /* skip */ }
    }
  } catch (e) { /* skip */ }
  return entries.filter(function (e) { return e && e.date && e.card; });
}

let calYear = null;
let calMonth = null; // 0-indexed
let entriesByDate = {};

function initCalendarState() {
  const now = new Date();
  calYear = now.getFullYear();
  calMonth = now.getMonth();
}

// 그 날의 기록 완성도: "none"(기록 없음) / "partial"(카드는 뽑았지만 아직 일기를
// 안 씀) / "full"(일기까지 남겨 꽃이 만개함)
function entryState(entry) {
  if (!entry) return "none";
  const hasNote = !!journalTextOf(entry).trim();
  return hasNote ? "full" : "partial";
}

// 달력 꽃 색상 팔레트 (배경 대비 기준을 통과하도록 고른 색들).
// 날짜 문자열을 해시해서 색을 고르기 때문에, 하루하루 꽃 색이 다양하게 바뀌면서도
// 같은 날은 다시 봐도 항상 같은 색을 유지합니다.
const FLOWER_PALETTE = [
  { petal: "#d9548f", center: "#a83768" }, // 로즈
  { petal: "#d4552f", center: "#a83f21" }, // 코랄
  { petal: "#b87816", center: "#8f5c10" }, // 앰버
  { petal: "#8b5fc9", center: "#6a459e" }, // 그레이프
  { petal: "#2f80c9", center: "#22609c" }, // 스카이블루
  { petal: "#1f9683", center: "#167a6a" }, // 틸
  { petal: "#c96a1f", center: "#9f5217" }, // 탠저린
  { petal: "#3f9350", center: "#2f7440" }, // 리프그린
  { petal: "#5f6fd0", center: "#4553a8" }, // 페리윙클
];

function hashDateToIndex(dateKey, mod) {
  let hash = 0;
  for (let i = 0; i < dateKey.length; i++) {
    hash = (hash * 31 + dateKey.charCodeAt(i)) >>> 0;
  }
  return hash % mod;
}

function flowerColorsFor(dateKey) {
  const idx = hashDateToIndex(dateKey, FLOWER_PALETTE.length);
  return FLOWER_PALETTE[idx];
}

function calFlowerIcon(state, dateKey) {
  if (state === "none") return "";
  const colors = flowerColorsFor(dateKey);
  let petals = "";
  if (state === "full") {
    for (let i = 0; i < 6; i++) {
      petals += '<ellipse class="cal-petal" fill="' + colors.petal + '" rx="3" ry="5.6" cy="-5.6" transform="rotate(' + (i * 60) + ')"/>';
    }
  }
  const centerR = state === "full" ? 2.4 : 3.1;
  return '<svg class="cal-flower-svg" width="16" height="16" viewBox="-9 -9 18 18" xmlns="http://www.w3.org/2000/svg">' +
    '<g>' + petals + '<circle class="cal-center" fill="' + colors.center + '" r="' + centerR + '"/></g>' +
    '</svg>';
}

async function loadGarden() {
  const entries = await readAllEntries();
  entriesByDate = {};
  entries.forEach(function (e) { entriesByDate[e.date] = e; });

  const countEl = document.getElementById("archive-count");
  countEl.textContent = entries.length ? ("총 " + entries.length + "일 기록") : "";

  if (calYear === null) initCalendarState();
  renderCalendar();
}

function changeMonth(delta) {
  if (calYear === null) initCalendarState();
  calMonth += delta;
  if (calMonth < 0) { calMonth = 11; calYear -= 1; }
  if (calMonth > 11) { calMonth = 0; calYear += 1; }
  renderCalendar();
}

function renderCalendar() {
  const label = document.getElementById("calendar-month-label");
  const grid = document.getElementById("calendar-grid");
  if (!label || !grid) return;

  label.textContent = calYear + "년 " + (calMonth + 1) + "월";

  const firstDay = new Date(calYear, calMonth, 1);
  const startWeekday = firstDay.getDay();
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const todayKey = getTodayKey();

  grid.innerHTML = "";

  for (let i = 0; i < startWeekday; i++) {
    const empty = document.createElement("div");
    empty.className = "cal-day empty-cell";
    grid.appendChild(empty);
  }

  for (let day = 1; day <= daysInMonth; day++) {
    const dateKey = calYear + "-" + String(calMonth + 1).padStart(2, "0") + "-" + String(day).padStart(2, "0");
    const entry = entriesByDate[dateKey];
    const state = entryState(entry);

    const cell = document.createElement("button");
    cell.type = "button";
    cell.className = "cal-day" + (state !== "none" ? " has-entry" : "") + (dateKey === todayKey ? " today" : "");
    cell.innerHTML =
      '<span class="cal-flower">' + calFlowerIcon(state, dateKey) + "</span>" +
      '<span class="cal-date-num">' + day + "</span>";
    if (state !== "none") {
      cell.addEventListener("click", function () { openGardenDetail(dateKey); });
    } else {
      cell.disabled = true;
    }
    grid.appendChild(cell);
  }
}

async function openGardenDetail(date) {
  const box = document.getElementById("garden-detail");
  let entry = null;
  try {
    const r = await window.storage.get(STORAGE_KEY_PREFIX + date);
    if (r && r.value) entry = JSON.parse(r.value);
  } catch (e) { /* skip */ }
  if (!entry) return;

  box.hidden = false;
  box.innerHTML =
    '<div class="detail-head">' +
      "<div>" +
        '<p class="detail-date">' + escapeHtml(formatDateKR(entry.date)) + "</p>" +
        '<p class="detail-card">' + escapeHtml(entry.card.symbol + " " + entry.card.kr + " · " + (entry.card.reversed ? "역방향" : "정방향")) + "</p>" +
      "</div>" +
      '<button class="link-btn" onclick="closeGardenDetail()">닫기</button>' +
    "</div>" +
    '<div class="meaning-box"><p class="label">오늘의 운세</p><p>' + escapeHtml(meaningText(entry.card)) + "</p></div>" +
    '<div class="entry-block">' +
      '<div class="entry-head"><span class="entry-title">📝 오늘의 일기</span></div>' +
      '<textarea id="d-note"></textarea>' +
      '<button class="save-btn" onclick="savePast(\'' + entry.date + '\',\'note\')">저장</button>' +
      '<p class="save-status" id="d-note-status"></p>' +
    "</div>";

  document.getElementById("d-note").value = journalTextOf(entry);
  box.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function closeGardenDetail() {
  const b = document.getElementById("garden-detail");
  b.hidden = true;
  b.innerHTML = "";
}

async function savePast(date, field) {
  let entry = null;
  try {
    const r = await window.storage.get(STORAGE_KEY_PREFIX + date);
    if (r && r.value) entry = JSON.parse(r.value);
  } catch (e) { /* skip */ }
  if (!entry) return;

  const val = document.getElementById("d-" + field).value.trim();
  entry[field] = val;
  entry[field + "At"] = new Date().toISOString();
  entry.savedAt = new Date().toISOString();
  await persist(entry);
  flashStatus("d-" + field + "-status", val ? "저장했어요" : "지웠어요");

  if (date === getTodayKey()) {
    currentEntry = entry;
    renderToday();
  }
  loadGarden();
}

/* ── 시작 ─────────────────────────────────── */
async function boot() {
  document.getElementById("today-date").textContent = formatDateKR(getTodayKey());
  try {
    const r = await window.storage.get(STORAGE_KEY_PREFIX + getTodayKey());
    if (r && r.value) currentEntry = JSON.parse(r.value);
  } catch (e) { /* 오늘 기록 없음 */ }
  renderToday();
  loadGarden();
}

boot();

// 오프라인에서도 열리도록 서비스워커 등록 (지원 안 하는 브라우저는 조용히 무시)
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () { /* 무시 */ });
  });
}
</script>
